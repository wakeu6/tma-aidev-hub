<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1920" width="1080" height="1920">
  <defs>
    <radialGradient id="bgGlow" cx="50%" cy="35%" r="60%">
      <stop offset="0%" stop-color="#00F0FF" stop-opacity="0.25"/>
      <stop offset="50%" stop-color="#7928CA" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#05060A" stop-opacity="1"/>
    </radialGradient>
    <pattern id="grid" width="60" height="60" patternUnits="userSpaceOnUse">
      <path d="M 60 0 L 0 0 0 60" fill="none" stroke="#FFFFFF" stroke-opacity="0.05" stroke-width="1"/>
    </pattern>
    <filter id="glow">
      <feGaussianBlur stdDeviation="15" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1080" height="1920" fill="#05060A"/>
  <rect width="1080" height="1920" fill="url(#bgGlow)"/>
  <rect width="1080" height="1920" fill="url(#grid)"/>

  <!-- Holographic Terminal Card in Center -->
  <g transform="translate(100, 520)">
    <!-- Glass Card Background -->
    <rect width="880" height="880" rx="36" fill="#0D1117" fill-opacity="0.85" stroke="#00F0FF" stroke-width="2" stroke-opacity="0.4" filter="url(#glow)"/>
    <!-- Card Header -->
    <circle cx="50" cy="50" r="12" fill="#FF5F56"/>
    <circle cx="85" cy="50" r="12" fill="#FFBD2E"/>
    <circle cx="120" cy="50" r="12" fill="#27C93F"/>
    <text x="440" y="58" font-family="monospace" font-size="24" fill="#8B949E" text-anchor="middle">terminal — zsh — 1080x1920</text>
    <line x1="0" y1="90" x2="880" y2="90" stroke="#30363D" stroke-width="1.5"/>

    <!-- Code Lines -->
    <text x="60" y="160" font-family="monospace" font-size="32" fill="#00F0FF">❯ cursor agent run --model sonnet-3.7</text>
    <text x="60" y="230" font-family="monospace" font-size="28" fill="#7EE787">✔ Analyzing repo architecture...</text>
    <text x="60" y="290" font-family="monospace" font-size="28" fill="#7EE787">✔ Applying 3 rules from .cursorrules</text>
    <text x="60" y="350" font-family="monospace" font-size="28" fill="#7EE787">✔ Generating fullstack TypeScript logic</text>
    <text x="60" y="420" font-family="monospace" font-size="30" fill="#E6EDF3">⚡ Production build passing: 100% tests</text>
    
    <!-- Code Block Box -->
    <rect x="50" y="470" width="780" height="340" rx="20" fill="#161B22" stroke="#30363D"/>
    <text x="80" y="540" font-family="monospace" font-size="26" fill="#FF7B72">export const</text>
    <text x="290" y="540" font-family="monospace" font-size="26" fill="#79C0FF">autonomousDev</text>
    <text x="510" y="540" font-family="monospace" font-size="26" fill="#E6EDF3">= async () =&gt; {</text>
    <text x="120" y="600" font-family="monospace" font-size="26" fill="#D2A8FF">  const speed</text>
    <text x="320" y="600" font-family="monospace" font-size="26" fill="#E6EDF3">= await ai.speed();</text>
    <text x="120" y="660" font-family="monospace" font-size="26" fill="#D2A8FF">  return speed</text>
    <text x="330" y="660" font-family="monospace" font-size="26" fill="#79C0FF">* 10; // 1 dev = 3x team</text>
    <text x="80" y="720" font-family="monospace" font-size="26" fill="#E6EDF3">};</text>
  </g>
</svg>
